spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:autodrive;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

server:
  address: 127.0.0.1

autodrive:
  seguridad:
    administrador:
      usuario: admin
      contrasena: admin-local-2026
