spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:autodrive;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  address: 127.0.0.1
