spring:
  application:
    name: autodrive-motors
  profiles:
    default: dev
  thymeleaf:
    cache: false

autodrive:
  seguridad:
    administrador:
      usuario: ${AUTODRIVE_ADMIN_USER:}
      contrasena: ${AUTODRIVE_ADMIN_PASSWORD:}
  tasa-cambio:
    url: ${AUTODRIVE_TASA_CAMBIO_URL:https://open.er-api.com/v6/latest/USD}
    connect-timeout: 2s
    read-timeout: 3s

server:
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
