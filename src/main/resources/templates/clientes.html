<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive Motors | Clientes</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/js/app.js"></script>
</head>
<body data-page="clientes">
<header class="encabezado">
    <a class="marca" href="/">AutoDrive Motors</a>
    <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a aria-current="page" href="/clientes">Clientes</a>
        <a href="/vehiculos">Vehículos</a>
        <a href="/ventas">Ventas</a>
    </nav>
</header>
<main class="contenedor dos-columnas">
    <section class="panel">
        <p class="eyebrow">Gestión</p>
        <h1>Registrar cliente</h1>
        <form id="form-cliente">
            <label>Nombre
                <input name="nombre" minlength="2" maxlength="60" required autocomplete="given-name">
            </label>
            <label>Apellido
                <input name="apellido" minlength="2" maxlength="60" required autocomplete="family-name">
            </label>
            <label>Correo electrónico
                <input name="email" type="email" maxlength="120" required autocomplete="email">
            </label>
            <label>Teléfono
                <input name="telefono" inputmode="numeric" pattern="[0-9+ -]{7,20}" maxlength="20" required autocomplete="tel">
            </label>
            <button type="submit">Guardar cliente</button>
        </form>
        <p id="mensaje-clientes" class="mensaje" role="status" aria-live="polite"></p>
    </section>
    <section class="panel tabla-panel">
        <div class="titulo-seccion">
            <div>
                <p class="eyebrow">Consulta REST</p>
                <h1>Clientes</h1>
            </div>
            <button id="recargar-clientes" class="secundario" type="button">Actualizar</button>
        </div>
        <div class="tabla-contenedor" aria-live="polite">
            <table>
                <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th><span class="sr-only">Acción</span></th></tr></thead>
                <tbody id="tabla-clientes"></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
