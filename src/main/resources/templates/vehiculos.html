<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive Motors | Vehículos</title>
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="/js/app.js"></script>
</head>
<body data-page="vehiculos">
<header class="encabezado">
    <a class="marca" href="/">AutoDrive Motors</a>
    <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/clientes">Clientes</a>
        <a aria-current="page" href="/vehiculos">Vehículos</a>
        <a href="/ventas">Ventas</a>
    </nav>
</header>
<main class="contenedor dos-columnas">
    <section class="panel">
        <p class="eyebrow">Inventario</p>
        <h1>Registrar vehículo</h1>
        <form id="form-vehiculo">
            <label>Placa
                <input name="placa" pattern="[A-Za-z0-9-]{5,10}" maxlength="10" required placeholder="ABC123">
            </label>
            <label>Marca
                <input name="marca" minlength="2" maxlength="50" required>
            </label>
            <label>Modelo
                <input name="modelo" minlength="1" maxlength="80" required>
            </label>
            <label>Año
                <input name="anio" type="number" min="1900" max="2100" required>
            </label>
            <label>Precio COP
                <input name="precioCop" type="number" min="1" step="1" required>
            </label>
            <button type="submit">Guardar vehículo</button>
        </form>
        <p id="mensaje-vehiculos" class="mensaje" role="status" aria-live="polite"></p>
    </section>
    <section class="panel tabla-panel">
        <div class="titulo-seccion">
            <div>
                <p class="eyebrow">Consulta REST</p>
                <h1>Inventario</h1>
            </div>
            <button id="recargar-vehiculos" class="secundario" type="button">Actualizar</button>
        </div>
        <form id="form-filtro-marca" class="filtro">
            <label for="marca-filtro">Filtrar por marca</label>
            <input id="marca-filtro" name="marca" maxlength="50" placeholder="Ej. Mazda">
            <button class="secundario" type="submit">Buscar</button>
            <button id="limpiar-filtro" class="enlace-boton" type="button">Ver todos</button>
        </form>
        <div class="tabla-contenedor" aria-live="polite">
            <table>
                <thead><tr><th>Placa</th><th>Vehículo</th><th>Año</th><th>Precio</th><th>Estado</th><th><span class="sr-only">Acción</span></th></tr></thead>
                <tbody id="tabla-vehiculos"></tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
